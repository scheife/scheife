<svg xmlns="http://www.w3.org/2000/svg" width="136" height="32" viewBox="0 0 136 32">
  <!-- Background -->
  <rect width="136" height="32" rx="6" fill="#606C38"/>

  <!-- Globe icon: center 18,16 / radius 7 -->
  <g transform="translate(11, 9)" stroke="#f5f5f0" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- outer circle -->
    <circle cx="7" cy="7" r="6.5"/>
    <!-- equator line -->
    <line x1="0.5" y1="7" x2="13.5" y2="7"/>
    <!-- vertical meridian (lens shape) -->
    <path d="M7 0.5 C10.8 3 10.8 11 7 13.5 C3.2 11 3.2 3 7 0.5"/>
  </g>

  <!-- Label -->
  <text
    x="30"
    y="21"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
    font-size="13"
    font-weight="600"
    fill="#f5f5f0"
  >alexmacht.at</text>
</svg>
